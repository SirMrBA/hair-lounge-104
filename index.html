<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hair Lounge 104 — Designvorschau: zwei Versionen</title>
<meta name="description" content="Zwei Website-Entwürfe für Hair Lounge 104 in Bochum zum Vergleich. Designvorschau von MakeSimpleIT.">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#e8dccb">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/fonts.css">
<style>
  :root { --paper: #e8dccb; --ink: #2e2119; --muted: #6c5848; --gold: #8f6a3f; --dark: #3a2a20; --cream: #f5ead9; --line: #cbb9a1; --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'DM Sans', Arial, sans-serif; --ease-out: cubic-bezier(.23, 1, .32, 1); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
  .logo { width: 180px; aspect-ratio: 500 / 149; background: var(--ink); -webkit-mask: url(./assets/logo.png) center / contain no-repeat; mask: url(./assets/logo.png) center / contain no-repeat; }
  main { flex: 1; width: min(1180px, 100% - 32px); margin: 0 auto; padding: 56px 0 64px; }
  .eyebrow { margin: 44px 0 0; font-size: 10px; letter-spacing: .16em; color: var(--muted); }
  h1 { margin: 14px 0 44px; font-family: var(--serif); font-weight: 400; font-size: clamp(46px, 7vw, 92px); line-height: .98; letter-spacing: -.045em; }
  h1 em { color: var(--gold); font-weight: 400; }
  .versions { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .version { display: block; }
  .shot { aspect-ratio: 960 / 566; overflow: hidden; background: var(--dark); box-shadow: 0 30px 60px -36px rgba(46, 33, 25, .55); }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; transition: scale 700ms var(--ease-out); }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .meta h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 34px; letter-spacing: -.02em; font-variant-numeric: lining-nums; }
  .meta span { font-size: 20px; transition: transform 200ms var(--ease-out); }
  .version p { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  footer { padding: 20px 16px 28px; text-align: center; font-size: 11px; color: var(--muted); }
  footer a { border-bottom: 1px solid currentColor; }
  @media (hover: hover) and (pointer: fine) {
    .version:hover .shot img { scale: 1.04; }
    .version:hover .meta span { transform: translate(3px, -3px); }
  }
  @media (max-width: 760px) {
    main { padding: 36px 0 48px; }
    .logo { width: 150px; }
    .eyebrow { margin-top: 32px; }
    h1 { margin-bottom: 30px; }
    .versions { grid-template-columns: 1fr; gap: 36px; }
    .meta h2 { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { .shot img, .meta span { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="logo" role="img" aria-label="Hair Lounge 104"></div>
  <p class="eyebrow">DESIGNVORSCHAU VON MAKESIMPLEIT</p>
  <h1>Zwei Entwürfe.<br><em>Ein Salon.</em></h1>
  <div class="versions">
    <a class="version" href="./v1/">
      <div class="shot"><img src="./assets/preview/v1.webp" alt="Startbereich von Version 1" width="960" height="566"></div>
      <div class="meta"><h2>Version 1</h2><span aria-hidden="true">↗</span></div>
      <p>Ausführlich, hell, viel Bewegung.</p>
    </a>
    <a class="version" href="./v2/">
      <div class="shot"><img src="./assets/preview/v2.webp" alt="Startbereich von Version 2" width="960" height="566"></div>
      <div class="meta"><h2>Version 2</h2><span aria-hidden="true">↗</span></div>
      <p>Kompakt, Beige und Braun, ruhiger.</p>
    </a>
  </div>
</main>
<footer>Unabhängige Vorschau, nicht die offizielle Website des Salons · <a href="https://www.hair-lounge-104.de/" target="_blank" rel="noopener noreferrer">hair-lounge-104.de ↗</a></footer>
</body>
</html>
